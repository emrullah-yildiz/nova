name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint:all

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        run: npm run test -- --coverage --reporter=verbose

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
      
      - name: Run Snyk scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production bundle
        run: npm run build
      
      - name: Archive production build
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 5
      
      - name: Report bundle size
        run: |
          echo "## Build Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build successful! ✅" >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    name: Deploy Dev Worker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: dev
      url: https://nova-dev.ey-myacc.workers.dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Write deployment metadata
        shell: bash
        run: |
          cat > dist/nova-deployment.json <<EOF
          {
            "environment": "dev",
            "branch": "${GITHUB_REF_NAME}",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Deploy to Cloudflare Workers (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@4.95.0 deploy --env dev

      - name: Verify dev deployment
        shell: bash
        run: |
          URL="https://nova-dev.ey-myacc.workers.dev/nova-deployment.json"
          for attempt in {1..12}; do
            BODY="$(curl -fsS "$URL" || true)"
            if echo "$BODY" | grep -q "${GITHUB_SHA}"; then
              echo "Dev deployment verified at $URL" >> "$GITHUB_STEP_SUMMARY"
              echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for dev deployment metadata ($attempt/12)..."
            sleep 5
          done
          echo "Dev deployment did not expose commit ${GITHUB_SHA} at $URL" >&2
          exit 1

  deploy-production:
    name: Deploy Production Worker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://hi-nova.work
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Write deployment metadata
        shell: bash
        run: |
          cat > dist/nova-deployment.json <<EOF
          {
            "environment": "production",
            "branch": "${GITHUB_REF_NAME}",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Deploy to Cloudflare Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@4.95.0 deploy --env=""

      - name: Verify production deployment
        shell: bash
        run: |
          URL="https://hi-nova.work/nova-deployment.json"
          for attempt in {1..12}; do
            BODY="$(curl -fsS "$URL" || true)"
            if echo "$BODY" | grep -q "${GITHUB_SHA}"; then
              echo "Production deployment verified at $URL" >> "$GITHUB_STEP_SUMMARY"
              echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for production deployment metadata ($attempt/12)..."
            sleep 5
          done
          echo "Production deployment did not expose commit ${GITHUB_SHA} at $URL" >&2
          exit 1
