name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint:all

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        run: npm run test -- --coverage --reporter=verbose

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
      
      - name: Run Snyk scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # Run only on pull requests that touch src/ or tests/ — no point running
    # E2E on docs-only or config-only changes.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.filter.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.filter.outputs.code == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: steps.filter.outputs.code == 'true' && failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production bundle
        run: npm run build
      
      - name: Archive production build
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 5
      
      - name: Report bundle size
        run: |
          echo "## Build Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build successful! ✅" >> $GITHUB_STEP_SUMMARY

  deploy-dev:
    name: Deploy Dev Worker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: dev
      url: https://nova-dev.ey-myacc.workers.dev
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Write deployment metadata
        shell: bash
        run: |
          cat > dist/nova-deployment.json <<EOF
          {
            "environment": "dev",
            "branch": "${GITHUB_REF_NAME}",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Deploy to Cloudflare Workers (dev)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          # Strip only whitespace (newline/CR/space/tab) a pasted secret may
          # carry — a trailing newline makes the Authorization header invalid
          # (wrangler: Headers.set: "..." is an invalid header value). We do NOT
          # filter by charset: that could silently corrupt an otherwise-valid
          # token and make Cloudflare reject it with 9106 "invalid token".
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy skipped::CF_API_TOKEN / CF_ACCOUNT_ID secrets are not set — skipping Cloudflare dev deploy. See docs/architecture/deployment.md (GitHub Actions deploy credentials)."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wrangler@4.95.0 deploy --env dev
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Verify dev deployment
        if: steps.deploy.outputs.deployed == 'true'
        shell: bash
        run: |
          URL="https://nova-dev.ey-myacc.workers.dev/nova-deployment.json"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          last_code=000
          for attempt in {1..12}; do
            last_code="$(curl -sSL -A "$UA" -o body.txt -w '%{http_code}' "$URL" 2>/dev/null || echo 000)"
            if grep -q "${GITHUB_SHA}" body.txt 2>/dev/null; then
              echo "Dev deployment verified at $URL (commit ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for dev deployment metadata ($attempt/12, http=$last_code)..."
            sleep 5
          done
          # The deploy step itself already succeeded. If Cloudflare's edge blocked
          # our probe (403/429/503 from WAF / bot protection), warn but don't fail.
          # A real 2xx-without-the-SHA is a genuinely stale deploy → fail.
          if [ "$last_code" = "403" ] || [ "$last_code" = "429" ] || [ "$last_code" = "503" ]; then
            echo "::warning title=Verify skipped::Cloudflare returned $last_code to the probe at $URL (WAF / bot protection). The deploy succeeded but the commit could not be confirmed."
            exit 0
          fi
          echo "Dev deployment did not expose commit ${GITHUB_SHA} at $URL (http=$last_code)" >&2
          exit 1

  deploy-production:
    name: Deploy Production Worker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://hi-nova.work
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Write deployment metadata
        shell: bash
        run: |
          cat > dist/nova-deployment.json <<EOF
          {
            "environment": "production",
            "branch": "${GITHUB_REF_NAME}",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Deploy to Cloudflare Workers (production)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          # Strip only whitespace (newline/CR/space/tab) a pasted secret may
          # carry — a trailing newline makes the Authorization header invalid
          # (wrangler: Headers.set: "..." is an invalid header value). We do NOT
          # filter by charset: that could silently corrupt an otherwise-valid
          # token and make Cloudflare reject it with 9106 "invalid token".
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy skipped::CF_API_TOKEN / CF_ACCOUNT_ID secrets are not set — skipping Cloudflare production deploy. See docs/architecture/deployment.md (GitHub Actions deploy credentials)."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wrangler@4.95.0 deploy --env=""
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Verify production deployment
        if: steps.deploy.outputs.deployed == 'true'
        shell: bash
        run: |
          URL="https://hi-nova.work/nova-deployment.json"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          last_code=000
          for attempt in {1..12}; do
            last_code="$(curl -sSL -A "$UA" -o body.txt -w '%{http_code}' "$URL" 2>/dev/null || echo 000)"
            if grep -q "${GITHUB_SHA}" body.txt 2>/dev/null; then
              echo "Production deployment verified at $URL (commit ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for production deployment metadata ($attempt/12, http=$last_code)..."
            sleep 5
          done
          # The deploy step itself already succeeded. If Cloudflare's edge blocked
          # our probe (403/429/503 from WAF / bot protection), warn but don't fail.
          # A real 2xx-without-the-SHA is a genuinely stale deploy → fail.
          if [ "$last_code" = "403" ] || [ "$last_code" = "429" ] || [ "$last_code" = "503" ]; then
            echo "::warning title=Verify skipped::Cloudflare returned $last_code to the probe at $URL (WAF / bot protection). The deploy succeeded but the commit could not be confirmed. Add a WAF skip rule for /nova-deployment.json to restore strict verification."
            exit 0
          fi
          echo "Production deployment did not expose commit ${GITHUB_SHA} at $URL (http=$last_code)" >&2
          exit 1
