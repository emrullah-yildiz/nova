# Cloudflare Workers config for the Nova API + static SPA.
# Phase 0 of the all-Cloudflare migration (see docs/architecture/accounts-collaboration.md).
# The Worker is the single deployment target for both the SPA and API.

name = "nova"
main = "worker/index.mjs"
compatibility_date = "2024-11-01"
# nodejs_compat lets the ported domain logic use the Node APIs workerd supports.
compatibility_flags = ["nodejs_compat"]
# Don't wipe variables/secrets set in the dashboard on each `wrangler deploy`
# (default reconciles them to this file, dropping dashboard-only ones).
keep_vars = true
workers_dev = false
routes = [
  { pattern = "hi-nova.work", custom_domain = true }
]

# Serve the Vite build as static assets; the Worker handles /api/* and falls
# back to these for everything else (SPA). Run `npm run build` first.
[assets]
directory = "./dist"
binding = "ASSETS"

# Non-secret, public config — deployed as runtime vars with the Worker so they
# reliably reach env. SECRETS (NOVA_SESSION_SECRET, NOVA_DATABASE_URL, GROQ_API_KEY,
# …) are NOT put here — set them with `wrangler secret put <NAME>` or the dashboard
# "Secret" type (kept across deploys by keep_vars above).
[vars]
NOVA_CORS_ORIGIN = "https://hi-nova.work"
NOVA_ALLOW_DEV_LOGIN = "false"
# The Google OAuth client id is PUBLIC (it's sent to every browser), so it lives
# here. Paste your full client id, ending in .apps.googleusercontent.com:
GOOGLE_CLIENT_ID = "766511449312-a3f505pvirs8f5gjol9ntmu09rue37jl.apps.googleusercontent.com"
# Public site URL — used as the base for email verification links.
NOVA_PUBLIC_URL = "https://hi-nova.work"
# From-address for verification emails. The domain (hi-nova.work) is verified in
# Resend; the API key itself is a SECRET — set it with `wrangler secret put RESEND_API_KEY`.
NOVA_EMAIL_FROM = "Nova <noreply@hi-nova.work>"
# SEC-015: enable HSTS on production asset responses (hi-nova.work is HTTPS-only via
# the Cloudflare custom domain). worker/index.mjs reads NOVA_HSTS === '1' and emits
# Strict-Transport-Security: max-age=63072000; includeSubDomains. PROD ONLY — dev
# (workers.dev / may be http locally) leaves this off below so it isn't HTTPS-pinned.
NOVA_HSTS = "1"

[env.dev]
name = "nova-dev"
workers_dev = true
routes = []

[env.dev.vars]
NOVA_CORS_ORIGIN = "https://nova-dev.ey-myacc.workers.dev"
NOVA_ALLOW_DEV_LOGIN = "false"
GOOGLE_CLIENT_ID = "766511449312-a3f505pvirs8f5gjol9ntmu09rue37jl.apps.googleusercontent.com"
NOVA_PUBLIC_URL = "https://nova-dev.ey-myacc.workers.dev"
NOVA_EMAIL_FROM = "Nova Dev <noreply@hi-nova.work>"
# SEC-015: dev MUST NOT send HSTS — it runs on workers.dev / may be served over
# plain HTTP locally, and pinning a shared *.workers.dev apex to HTTPS would affect
# unrelated workers. Explicitly off (env vars don't inherit from the top-level [vars]).
NOVA_HSTS = "0"

# SEC-012: dev MUST bind its OWN KV namespaces, distinct from production, so a
# nova-dev deploy can never read/write/forge production session, email-verify,
# or rate-limit state. The ids below are PLACEHOLDERS — real dev-only namespaces
# must be created once from a Cloudflare-authed shell (you cannot create them in
# CI / this repo). Run, then paste the returned ids over the placeholders:
#   npx wrangler kv namespace create SESSION_KV --env dev
#   npx wrangler kv namespace create RATE_KV --env dev
# See docs/architecture/deployment.md > "Dev KV namespaces (SEC-012)".
# Until these are replaced, `wrangler deploy --env dev` will fail fast (unknown
# namespace id) instead of silently sharing prod KV — which is the intended
# fail-safe.
[[env.dev.kv_namespaces]]
binding = "SESSION_KV"
id = "REPLACE_WITH_DEV_SESSION_KV_ID"

[[env.dev.kv_namespaces]]
binding = "RATE_KV"
id = "REPLACE_WITH_DEV_RATE_KV_ID"

[[env.dev.durable_objects.bindings]]
name = "PROJECT_ROOM"
class_name = "ProjectRoom"

# PRODUCTION KV (top-level = the `nova` Worker from main). Session state
# (sessions + email-verification tokens) and AI-proxy per-IP rate limiting.
# Both bindings point at the same prod "nova-sessions" namespace — their keys
# are prefixed differently (session:/emailverify:/rate: vs rl:) so they don't
# collide. These ids are PRODUCTION-ONLY; dev binds its own ids above (SEC-012),
# so dev and prod no longer share session/verify/rate state.
# (Future hardening, optional: give RATE_KV its own prod namespace too, so a
#  rate-bucket flush can't touch session keys. Needs a new prod namespace id.)
[[kv_namespaces]]
binding = "SESSION_KV"
id = "2959d0665b324e53b58c2d1d5b752ffe"

[[kv_namespaces]]
binding = "RATE_KV"
id = "2959d0665b324e53b58c2d1d5b752ffe"

# Accelerated/pooled Postgres to Neon (Phase 0 DB step). Create with:
#   wrangler hyperdrive create nova-neon --connection-string="$NOVA_DATABASE_URL"
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# Realtime collaboration rooms: one ProjectRoom Durable Object per project,
# fanning out cursors + edit-ops over WebSockets (see worker/room.mjs).
[[durable_objects.bindings]]
name = "PROJECT_ROOM"
class_name = "ProjectRoom"

# SQLite-backed Durable Object class. The free Workers plan REQUIRES
# new_sqlite_classes (the legacy key-value-backed new_classes is paid-only).
# ProjectRoom keeps presence in memory and uses no DO storage, so the SQLite
# backend is a no-cost fit.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectRoom"]
