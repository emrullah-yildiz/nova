# Cloudflare Workers config for the Nova API + static SPA.
# Phase 0 of the all-Cloudflare migration (see docs/accounts-collaboration.md).
# The legacy Vercel deployment stays live until cutover; this is additive.

name = "nova"
main = "worker/index.mjs"
compatibility_date = "2024-11-01"
# nodejs_compat lets the ported domain logic use the Node APIs workerd supports.
compatibility_flags = ["nodejs_compat"]
# Don't wipe variables/secrets set in the dashboard on each `wrangler deploy`
# (default reconciles them to this file, dropping dashboard-only ones).
keep_vars = true

# Serve the Vite build as static assets; the Worker handles /api/* and falls
# back to these for everything else (SPA). Run `npm run build` first.
[assets]
directory = "./dist"
binding = "ASSETS"

# Non-secret, public config — deployed as runtime vars with the Worker so they
# reliably reach env. SECRETS (NOVA_SESSION_SECRET, NOVA_DATABASE_URL, GROQ_API_KEY,
# …) are NOT put here — set them with `wrangler secret put <NAME>` or the dashboard
# "Secret" type (kept across deploys by keep_vars above).
[vars]
NOVA_CORS_ORIGIN = "*"
NOVA_ALLOW_DEV_LOGIN = "false"
# The Google OAuth client id is PUBLIC (it's sent to every browser), so it lives
# here. Paste your full client id, ending in .apps.googleusercontent.com:
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"

# Per-IP AI-proxy rate limiting (replaces the in-memory Map). Create with:
#   wrangler kv namespace create RATE_KV
# then paste the id below.
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "<kv-namespace-id>"

# Accelerated/pooled Postgres to Neon (Phase 0 DB step). Create with:
#   wrangler hyperdrive create nova-neon --connection-string="$NOVA_DATABASE_URL"
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# Realtime collaboration rooms (Phase 4). Uncomment once the ProjectRoom class
# ships in the worker entry — a DO binding without its class fails to deploy.
# [[durable_objects.bindings]]
# name = "PROJECT_ROOM"
# class_name = "ProjectRoom"
#
# [[migrations]]
# tag = "v1"
# new_classes = ["ProjectRoom"]
